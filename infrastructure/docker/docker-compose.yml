# ============================================================
# BotecoPRO – Local development environment
# Usage: make up
# ============================================================
version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botecopro_dev}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17.0
    # NOTE: Odoo 19 image is not yet publicly available.
    # Update image tag to odoo:19.0 once released.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"  # longpolling
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ../../addons:/mnt/extra-addons
      - odoo-filestore:/var/lib/odoo
    command: >
      odoo
        --db_host=db
        --db_user=${POSTGRES_USER:-odoo}
        --db_password=${POSTGRES_PASSWORD:-odoo}
        --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
        --database=${ODOO_DB:-botecopro_dev}
        --dev=all

volumes:
  pgdata:
  odoo-filestore:
