name: Odoo Addons CI

on:
  push:
    paths:
      - "addons/**"
      - ".github/workflows/odoo.yml"
  pull_request:
    paths:
      - "addons/**"
      - ".github/workflows/odoo.yml"

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint addons
        run: ruff check addons/

  validate-manifests:
    name: Validate Addon Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate __manifest__.py files
        run: |
          python3 - << 'PYEOF'
          import ast, sys
          from pathlib import Path

          errors = []
          for manifest in Path("addons").rglob("__manifest__.py"):
              try:
                  with open(manifest) as f:
                      content = f.read()
                  data = ast.literal_eval(content)
                  required = ["name", "version", "depends", "installable"]
                  for field in required:
                      if field not in data:
                          errors.append(f"{manifest}: missing '{field}'")
              except Exception as e:
                  errors.append(f"{manifest}: {e}")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)
          else:
              print(f"All manifests valid ({len(list(Path('addons').rglob('__manifest__.py')))} checked)")
          PYEOF
