name: Flutter CI

on:
  push:
    paths:
      - "apps/mobile"
      - "apps/mobile/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "apps/mobile"
      - "apps/mobile/**"
      - ".github/workflows/flutter.yml"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Reject tracked local credentials
        run: |
          if git ls-files --error-unmatch .env .env.local '.env.*.local' >/dev/null 2>&1; then
            echo "A local environment file is tracked. Remove it before merging."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
