name: Flutter CI

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter.yml"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage
