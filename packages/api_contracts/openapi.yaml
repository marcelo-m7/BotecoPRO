openapi: "3.1.0"
info:
  title: BotecoPRO API
  version: "1"
  description: |
    REST API para integração entre o aplicativo Flutter e o backend Odoo.
    Base URL: /api/v1/botecopro
  contact:
    name: BotecoPRO
    url: https://boteco.pt

servers:
  - url: http://localhost:8069/api/v1/botecopro
    description: Desenvolvimento local
  - url: https://{host}/api/v1/botecopro
    description: Produção
    variables:
      host:
        default: app.boteco.pt

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Verifica status do serviço e retorna versão da API.
      tags: [System]
      security: []
      responses:
        "200":
          description: Serviço operacional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      operationId: login
      summary: Autenticar utilizador
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      summary: Encerrar sessão
      tags: [Auth]
      responses:
        "200":
          description: Sessão encerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id

  schemas:
    HealthResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          required: [status, api_version, botecopro_version]
          properties:
            status:
              type: string
              example: ok
            api_version:
              type: string
              example: "1"
            botecopro_version:
              type: string
              example: "0.1.0"

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          format: email
          example: manager@boteco.pt
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          required: [uid, name, login, session_id]
          properties:
            uid:
              type: integer
              example: 3
            name:
              type: string
              example: João Silva
            login:
              type: string
              example: joao@boteco.pt
            session_id:
              type: string
              example: abc123...

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: Invalid credentials

security:
  - sessionCookie: []
